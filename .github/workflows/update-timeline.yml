name: Update Timeline Chart

on:
  push:
    branches:
      - main
    paths:
      - '**/tasks.xlsx'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        pip install pandas matplotlib openpyxl

    - name: Generate Gantt Chart
      run: |
        python plot_timeline.py

    - name: Commit Updated Chart
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add timeline_latest.png timeline_old.png
        git diff --cached --quiet || git commit -m "Auto-update timeline_latest.png"
        git push
      

